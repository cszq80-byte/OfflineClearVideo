name: Build Offline Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare pretrained FSRCNN model and verify conversion
        run: |
          python -m pip install --disable-pip-version-check 'tensorflow-cpu==2.16.1' numpy
          python tools/prepare_model.py
      - name: Build and unit test
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Verify APK and checksums
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OfflineClearVideo-v0.4-AI-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/sha256.txt
          retention-days: 30
          if-no-files-found: error
