name: Build Offline Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK packages on GitHub-hosted runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "No sdkmanager under $ANDROID_HOME; installed paths:"
            find "$ANDROID_HOME" -maxdepth 3 -type f -name '*sdkmanager*' || true
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare pretrained FSRCNN model and verify conversion
        run: |
          python -m pip install --disable-pip-version-check 'tensorflow-cpu==2.16.1' numpy
          python tools/prepare_model.py
      - name: Prepare Real-ESRGAN neural model and verify against basic interpolation
        run: |
          python -m pip install --disable-pip-version-check 'huggingface_hub==0.35.3' 'onnxruntime==1.20.1' pillow
          python tools/prepare_real_esrgan.py
      - name: Compare synthetic skin and woven fabric against bicubic output
        run: python tools/benchmark_skin_fabric.py
      - name: Build and unit test
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Verify APK and checksums
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OfflineClearVideo-v0.7-Detail-Compare-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/sha256.txt
            model-synthetic-visual-check.png
            model-skin-cloth-synthetic-comparison.png
            model-skin-cloth-synthetic-report.json
            app/src/main/assets/real-esrgan-model-info.json
          retention-days: 30
          if-no-files-found: error
