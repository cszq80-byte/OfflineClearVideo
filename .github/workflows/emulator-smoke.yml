name: Android Emulator Video Pipeline Smoke Test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emulator-smoke.yml'
      - 'app/src/androidTest/**'
      - 'app/src/main/**'
  workflow_dispatch:
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Find Android SDK manager
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare verified pretrained neural network
        run: |
          python -m pip install --disable-pip-version-check 'tensorflow-cpu==2.16.1' numpy
          python tools/prepare_model.py
      - name: Prepare Real-ESRGAN neural model and verify against basic interpolation
        run: |
          python -m pip install --disable-pip-version-check 'huggingface_hub==0.35.3' 'onnxruntime==1.20.1' pillow
          python tools/prepare_real_esrgan.py
      - name: Enable acceleration
        run: |
          test -e /dev/kvm && sudo chmod 666 /dev/kvm || true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest --stacktrace
      - name: Save instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-runtime-test-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: ignore
